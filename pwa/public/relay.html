<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Portpass autofill</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icon.svg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0 }
body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px;
  background: #1a1d21;
  color: #f1ede4;
  height: 100dvh;
}
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
  padding: 14px;
  gap: 8px;
}
#brand {
  display: flex;
  align-items: center;
  gap: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid #2e3240;
  margin-bottom: 2px;
  flex-shrink: 0;
}
#brand img { width: 24px; height: 24px }
#brand span { font-weight: 600; font-size: 15px; letter-spacing: 0.01em }
#header { font-weight: 600; padding-bottom: 2px }
#status { font-size: 13px; color: #888 }
#records {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.rec-row {
  padding: 8px 10px;
  border-radius: 6px;
  background: #252830;
  cursor: pointer;
}
.rec-row:hover { background: #2e3240 }
.rec-title-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.rec-title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rec-badge { font-size: 11px; color: #8db8ff; flex-shrink: 0 }
label.rec-replace {
  display: flex;
  align-items: baseline;
  gap: 6px;
  cursor: pointer;
  margin: 6px 0 0 0;
}
label.rec-replace span { font-size: 11px; color: #aaa }
.err { color: #e06c75; font-size: 13px }
#pin-screen { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 }
#pin-label { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em }
#pin-code { font-size: 32px; font-weight: 700; letter-spacing: 0.12em; color: #e8b04a; line-height: 1.2 }
#pin-hint { font-size: 12px; color: #888 }
</style>
</head>
<body>
<div id="app">
  <div id="brand">
    <img src="icon.svg" alt="">
    <span>Portpass</span>
  </div>
  <div id="header" style="display:none">Select a record to autofill</div>
  <div id="status">Connecting to Portpass…</div>
  <div id="records" style="display:none"></div>
</div>
<script>
;(function() {
  'use strict'

  // ── Shared state ──────────────────────────────────────────────────────────
  var nonce = crypto.randomUUID()
  var ch = new BroadcastChannel('portpass-autofill')
  var bookmarkletOrigin = null
  var isSecure = false
  var currentUrl = ''
  var saveUrl = ''

  // ── Mode detection state ──────────────────────────────────────────────────
  var cprivKey = null       // private key from init message; used by cross-profile path
  var delegateId = null     // delegate UUID; switchboard request endpoint
  var bcPongArrived = false
  var modeDecided = false
  var modeTimer = null

  // ── Cross-profile state ───────────────────────────────────────────────────
  // ECDH key pair generated at startup; public key sent to Portpass via the
  // switchboard so Portpass can encrypt the credential blob for us.
  var cpEcdhKeyPair = null
  var cpEcdhSpkiB64 = null
  var switchboardWsUrl = 'ws://localhost:7577/ws'  // updated from relay-pong if available

  // ── Same-profile state ────────────────────────────────────────────────────
  var relayNonce = null
  var sessionKey = null
  var keyPair = null
  var selectedUuid = null
  var selectedVaultUuid = null

  var $header  = document.getElementById('header')
  var $status  = document.getElementById('status')
  var $records = document.getElementById('records')

  // Derives a 6-digit PIN from ECDH shared secret bits; same result on both sides.
  function pinFromBits(bytes) {
    var num = ((bytes[0] << 16) | (bytes[1] << 8) | bytes[2]) % 1000000
    return ('000000' + num).slice(-6)
  }

  function showPinScreen(pin) {
    $header.style.display = 'none'
    $records.style.display = 'none'
    $status.style.display = 'none'
    var el = document.createElement('div')
    el.id = 'pin-screen'
    el.innerHTML = '<div id="pin-label">Pairing code</div><div id="pin-code">' + pin + '</div><div id="pin-hint">Confirm this code matches in Portpass to complete pairing</div>'
    document.getElementById('app').appendChild(el)
  }

  // ── Startup: generate ECDH key pair, signal ready ─────────────────────────
  // 'ready' is sent as soon as the key pair is available, before the BC ping
  // completes. Mode is decided in onOpenerMessage once both init and pong state are known.
  crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey', 'deriveBits']
  ).then(function(kp) {
    cpEcdhKeyPair = kp
    return crypto.subtle.exportKey('spki', kp.publicKey)
  }).then(function(spki) {
    cpEcdhSpkiB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(spki)))
    if (window.opener) window.opener.postMessage({ type: 'ready' }, '*')
    window.addEventListener('message', onOpenerMessage)
  }).catch(function() { sendError('Startup failed') })

  // ── Ping Dashboard via BroadcastChannel (runs concurrently with ECDH above) ─
  // If Portpass responds, same-profile mode is used; otherwise cross-profile.
  // Mode is finalised in onOpenerMessage once init arrives.
  ch.onmessage = function(e) {
    if (e.data && e.data.type === 'relay-pong' && e.data.nonce === nonce) {
      if (e.data.switchboardUrl) {
        switchboardWsUrl = e.data.switchboardUrl.replace(/^http/, 'ws') + '/ws'
      }
      bcPongArrived = true
      if (!modeDecided && cprivKey !== null) {
        modeDecided = true
        clearTimeout(modeTimer)
        doHello()
      }
    }
  }
  ch.postMessage({ type: 'relay-ping', nonce: nonce })

  // ── Mode detection: init message from bookmarklet ─────────────────────────
  function onOpenerMessage(event) {
    var msg = event.data
    if (!msg || msg.type !== 'init') return
    window.removeEventListener('message', onOpenerMessage)

    bookmarkletOrigin = event.origin
    currentUrl = msg.url || ''
    saveUrl = msg.saveUrl || currentUrl
    isSecure = !!msg.isSecure
    cprivKey = msg.privKey || null
    delegateId = msg.delegateId || null

    // Validate URL hostname against browser-reported origin.
    if (currentUrl) {
      try {
        var sentHost = currentUrl.split('/')[0]
        var evHost = new URL(event.origin).host.replace(/^www\./, '').toLowerCase()
        if (evHost && sentHost !== evHost) { sendError('URL mismatch — security check failed'); return }
      } catch(_) {}
    }

    if (bcPongArrived) {
      modeDecided = true
      doHello()
    } else {
      modeTimer = setTimeout(function() {
        if (!modeDecided) {
          modeDecided = true
          if (cprivKey) {
            startCrossProfile(cprivKey)
          } else {
            sendError('Portpass is not open — open and unlock Portpass first')
          }
        }
      }, 200)
    }
  }

  // ── Cross-profile path ────────────────────────────────────────────────────

  async function startCrossProfile(privKeyJwk) {
    $status.textContent = 'Requesting credentials…'
    try {
      var signingKey = await crypto.subtle.importKey(
        'jwk', privKeyJwk, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']
      )
      var pubJwk = { kty: privKeyJwk.kty, crv: privKeyJwk.crv, x: privKeyJwk.x, y: privKeyJwk.y }
      var pubKey = await crypto.subtle.importKey(
        'jwk', pubJwk, { name: 'ECDSA', namedCurve: 'P-256' }, true, ['verify']
      )
      var pubSpki = await crypto.subtle.exportKey('spki', pubKey)
      var pubSpkiB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(pubSpki)))

      var ts = Date.now()
      var signedPayload = JSON.stringify({ url: currentUrl, nonce: nonce, ecdh: cpEcdhSpkiB64, ts: ts })
      var sigBytes = await crypto.subtle.sign(
        { name: 'ECDSA', hash: 'SHA-256' }, signingKey, new TextEncoder().encode(signedPayload)
      )
      var sigB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(sigBytes)))

      if (!delegateId) throw new Error('No delegate ID — reinstall the bookmarklet')

      $status.textContent = 'Waiting for Portpass…'
      var publishMsg = {
        type: 'publish', channel: delegateId, replyTo: nonce,
        url: currentUrl, ecdh: cpEcdhSpkiB64, ts: ts, sig: sigB64, pub: pubSpkiB64
      }

      var ws
      try { ws = new WebSocket(switchboardWsUrl) } catch(e) {
        sendError('switchboard is not running — start it first'); return
      }
      var cpWs = ws
      ws.onopen = function() { ws.send(JSON.stringify(publishMsg)) }
      ws.onerror = function() { if (cpWs === ws) { cpWs = null; sendError('switchboard is not running — start it first') } }
      ws.onclose = function() { if (cpWs === ws) { cpWs = null; sendError('switchboard closed unexpectedly') } }
      ws.onmessage = async function(e) {
        try {
          var msg = JSON.parse(e.data)
          if (msg.type === 'error') {
            cpWs = null; ws.close()
            sendError(msg.message || 'Autofill failed')
            return
          }
          if (msg.type !== 'reply') return

          if (msg.pinRequired) {
            var ephPubJwk = JSON.parse(atob(msg.ephPub))
            var ephPubKey = await crypto.subtle.importKey(
              'jwk', ephPubJwk, { name: 'ECDH', namedCurve: 'P-256' }, false, []
            )
            var pinBits = await crypto.subtle.deriveBits(
              { name: 'ECDH', public: ephPubKey }, cpEcdhKeyPair.privateKey, 24
            )
            showPinScreen(pinFromBits(new Uint8Array(pinBits)))
            // Keep WS open; Dashboard sends paired/error reply after user confirms in Portpass.
            return
          }

          cpWs = null; ws.close()
          if (msg.paired) {
            document.getElementById('pin-screen')?.remove()
            $status.style.display = ''
            $status.textContent = 'Bookmarklet paired — click it again to autofill'
            setTimeout(function() { window.close() }, 2500)
            return
          }
          await processRelayBlob(msg)
        } catch(e) {
          cpWs = null; ws.close()
          sendError(e.message || 'Autofill failed')
        }
      }

    } catch(e) {
      sendError(e.message || 'Autofill failed')
    }
  }

  // Decrypts the switchboard reply using the ECDH key pair generated at startup.
  // Reply format: { type:"reply", replyTo, ephPub, iv, ciphertext }
  // Or error: { type:"reply", replyTo, error: "message" }
  // Plaintext: JSON array of records, each with pre-decrypted fields.
  async function processRelayBlob(blob) {
    if (blob.error) { sendError(blob.error); return }
    try {
      var ephPubJwk = JSON.parse(atob(blob.ephPub))
      var ephPubKey = await crypto.subtle.importKey(
        'jwk', ephPubJwk, { name: 'ECDH', namedCurve: 'P-256' }, false, []
      )
      var cpSessionKey = await crypto.subtle.deriveKey(
        { name: 'ECDH', public: ephPubKey }, cpEcdhKeyPair.privateKey,
        { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      )
      var iv = Uint8Array.from(atob(blob.iv), function(c) { return c.charCodeAt(0) })
      var ct = Uint8Array.from(atob(blob.ciphertext), function(c) { return c.charCodeAt(0) })
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, cpSessionKey, ct)
      var records = JSON.parse(new TextDecoder().decode(pt))
      showCrossProfilePicker(records)
    } catch(e) {
      sendError('Decrypt failed: ' + e.message)
    }
  }

  // Cross-profile picker: fields are already decrypted; clicking a row sends fill immediately.
  function showCrossProfilePicker(records) {
    if (!records || !records.length) { sendError('No matching passwords found'); return }
    $status.style.display = 'none'
    $header.style.display = ''
    $records.style.display = ''

    records.forEach(function(rec) {
      var row = document.createElement('div')
      row.className = 'rec-row'
      var titleRow = document.createElement('div')
      titleRow.className = 'rec-title-row'
      var titleEl = document.createElement('span')
      titleEl.className = 'rec-title'
      titleEl.textContent = rec.title
      titleRow.appendChild(titleEl)

      if (rec.isCurrent) {
        var badge = document.createElement('span')
        badge.className = 'rec-badge'
        badge.textContent = 'open'
        titleRow.appendChild(badge)
      }
      if (rec.matchType === 'exact') {
        var mb = document.createElement('span')
        mb.style.cssText = 'font-size:11px;color:#7dbf8e;flex-shrink:0'
        mb.textContent = 'URL match'
        titleRow.appendChild(mb)
      } else if (rec.matchType === 'fuzzy') {
        var mb = document.createElement('span')
        mb.style.cssText = 'font-size:11px;color:#888;flex-shrink:0'
        mb.textContent = 'similar URL'
        titleRow.appendChild(mb)
      }
      row.appendChild(titleRow)

      ;(function(r) {
        row.onclick = function() {
          if (!isSecure && sequenceHasSensitiveCode(r.autotype || '', r.sensitiveCodes || [])) {
            sendError('Cannot autofill sensitive fields on a non-HTTPS page')
            return
          }
          if (window.opener) {
            window.opener.postMessage(
              { type: 'fill', title: r.title, autotype: r.autotype, fields: r.fields },
              bookmarkletOrigin || '*'
            )
          }
          setTimeout(function() { window.close() }, 100)
        }
      })(rec)

      $records.appendChild(row)
    })
  }

  // ── Same-profile path ─────────────────────────────────────────────────────

  async function doHello() {
    try {
      keyPair = await crypto.subtle.generateKey(
        { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey', 'deriveBits']
      )
      var pubJwk = await crypto.subtle.exportKey('jwk', keyPair.publicKey)
      var ecdhSpki = await crypto.subtle.exportKey('spki', keyPair.publicKey)
      var ecdhSpkiB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(ecdhSpki)))
      relayNonce = crypto.randomUUID()

      // Sign {relayNonce, ecdhSpki} with the ECDSA private key so Dashboard can
      // verify this relay-hello came from a registered delegate bookmarklet.
      var sigB64 = null, pubSpkiB64 = null
      if (cprivKey) {
        try {
          var signingKey = await crypto.subtle.importKey(
            'jwk', cprivKey, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign']
          )
          var ecdsaPubKey = await crypto.subtle.importKey(
            'jwk', { kty: cprivKey.kty, crv: cprivKey.crv, x: cprivKey.x, y: cprivKey.y },
            { name: 'ECDSA', namedCurve: 'P-256' }, true, ['verify']
          )
          var ecdsaSpki = await crypto.subtle.exportKey('spki', ecdsaPubKey)
          pubSpkiB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(ecdsaSpki)))
          var sigBytes = await crypto.subtle.sign(
            { name: 'ECDSA', hash: 'SHA-256' }, signingKey,
            new TextEncoder().encode(JSON.stringify({ relayNonce: relayNonce, ecdhSpki: ecdhSpkiB64 }))
          )
          sigB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(sigBytes)))
        } catch(_) { /* signing unavailable */ }
      }

      ch.onmessage = function(e) {
        var msg = e.data
        if (!msg || msg.nonce !== relayNonce) return
        if (msg.type === 'relay-hello-response') onHelloResponse(msg)
        else if (msg.type === 'relay-error') sendError(msg.message)
      }
      var helloMsg = { type: 'relay-hello', pubkey: pubJwk, ecdhSpki: ecdhSpkiB64, nonce: relayNonce }
      if (sigB64 && pubSpkiB64) { helloMsg.sig = sigB64; helloMsg.pub = pubSpkiB64 }
      ch.postMessage(helloMsg)
    } catch(_) {
      sendError('Key exchange failed')
    }
  }

  async function onHelloResponse(msg) {
    var ppPub
    try {
      ppPub = await crypto.subtle.importKey(
        'jwk', msg.pubkey, { name: 'ECDH', namedCurve: 'P-256' }, false, []
      )
      sessionKey = await crypto.subtle.deriveKey(
        { name: 'ECDH', public: ppPub }, keyPair.privateKey,
        { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      )
    } catch(_) { sendError('Key exchange failed'); return }

    if (msg.pinRequired) {
      try {
        var pinBits = await crypto.subtle.deriveBits(
          { name: 'ECDH', public: ppPub }, keyPair.privateKey, 24
        )
        showPinScreen(pinFromBits(new Uint8Array(pinBits)))
      } catch(_) { sendError('PIN derivation failed'); return }

      var waitNonce = relayNonce
      ch.onmessage = function(e) {
        var m = e.data
        if (!m || m.nonce !== waitNonce) return
        if (m.type === 'relay-pin-confirmed') {
          document.getElementById('pin-screen')?.remove()
          $status.style.display = ''
          $status.textContent = 'Bookmarklet paired — click it again to autofill'
          setTimeout(function() { window.close() }, 2500)
        } else if (m.type === 'relay-error') {
          sendError(m.message || 'Pairing failed')
        }
      }
      return
    }

    ch.onmessage = onBCMessage
    $status.textContent = 'Searching for matches…'
    ch.postMessage({ type: 'relay-query', url: currentUrl, nonce: relayNonce })
  }

  function onBCMessage(e) {
    var msg = e.data
    if (!msg || msg.nonce !== relayNonce) return
    if (msg.type === 'relay-records')    showPicker(msg.records)
    else if (msg.type === 'relay-record')    deliverFill(msg)
    else if (msg.type === 'relay-url-saved') fetchCredentials()
    else if (msg.type === 'relay-error')     sendError(msg.message)
  }

  function showPicker(records) {
    if (!records || !records.length) { sendError('Open a record in Portpass first'); return }
    $status.style.display = 'none'
    $header.style.display = ''
    $records.style.display = ''

    records.forEach(function(rec) {
      var row = document.createElement('div')
      row.className = 'rec-row'
      var titleRow = document.createElement('div')
      titleRow.className = 'rec-title-row'
      var titleEl = document.createElement('span')
      titleEl.className = 'rec-title'
      titleEl.textContent = rec.title
      titleRow.appendChild(titleEl)

      if (rec.isCurrent) {
        var badge = document.createElement('span')
        badge.className = 'rec-badge'
        badge.textContent = 'open'
        titleRow.appendChild(badge)
      }
      if (rec.matchType === 'exact') {
        var mb = document.createElement('span')
        mb.style.cssText = 'font-size:11px;color:#7dbf8e;flex-shrink:0'
        mb.textContent = 'URL match'
        titleRow.appendChild(mb)
      } else if (rec.matchType === 'fuzzy') {
        var mb = document.createElement('span')
        mb.style.cssText = 'font-size:11px;color:#888;flex-shrink:0'
        mb.textContent = 'similar URL'
        titleRow.appendChild(mb)
      }
      row.appendChild(titleRow)

      var replaceCheck = null
      if (rec.existingUrl && canonicalURL(rec.existingUrl) !== currentUrl) {
        var replaceLabel = document.createElement('label')
        replaceLabel.className = 'rec-replace'
        replaceCheck = document.createElement('input')
        replaceCheck.type = 'checkbox'
        replaceCheck.onclick = function(e) { e.stopPropagation() }
        var replaceText = document.createElement('span')
        replaceText.textContent = 'Replace "' + rec.existingUrl + '" → "' + saveUrl + '"'
        replaceLabel.appendChild(replaceCheck)
        replaceLabel.appendChild(replaceText)
        row.appendChild(replaceLabel)
      }

      row.onclick = function() {
        doAutofill(rec.uuid, rec.vaultUuid, replaceCheck ? replaceCheck.checked : false)
      }

      $records.appendChild(row)
    })
  }

  function doAutofill(uuid, vaultUuid, replaceUrl) {
    selectedUuid = uuid
    selectedVaultUuid = vaultUuid
    $header.style.display = 'none'
    $records.style.display = 'none'
    $status.style.display = ''
    $status.textContent = 'Fetching credentials…'
    if (replaceUrl) {
      ch.postMessage({ type: 'relay-save-url', uuid: uuid, vaultUuid: vaultUuid, url: saveUrl, nonce: relayNonce })
    } else {
      fetchCredentials()
    }
  }

  function fetchCredentials() {
    ch.postMessage({ type: 'relay-query', uuid: selectedUuid, vaultUuid: selectedVaultUuid, nonce: relayNonce })
  }

  async function deliverFill(msg) {
    try {
      if (!isSecure && sequenceHasSensitiveCode(msg.autotype || '', msg.sensitiveCodes || [])) {
        sendError('Cannot autofill sensitive fields on a non-HTTPS page')
        return
      }
      var iv = Uint8Array.from(atob(msg.iv), function(c) { return c.charCodeAt(0) })
      var ct = Uint8Array.from(atob(msg.ciphertext), function(c) { return c.charCodeAt(0) })
      var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, sessionKey, ct)
      var fields = JSON.parse(new TextDecoder().decode(pt))
      if (window.opener) {
        window.opener.postMessage(
          { type: 'fill', title: msg.title, autotype: msg.autotype, fields: fields },
          bookmarkletOrigin || '*'
        )
      }
      setTimeout(function() { window.close() }, 100)
    } catch(_) {
      sendError('Failed to decrypt credentials')
    }
  }

  // ── Shared helpers ────────────────────────────────────────────────────────

  // Returns true if the autotype sequence references any of the given sensitive field codes.
  // Parses properly so \\ (literal backslash) does not cause false positives.
  function sequenceHasSensitiveCode(seq, sensitiveCodes) {
    if (!sensitiveCodes || !sensitiveCodes.length) return false
    var i = 0
    while (i < seq.length) {
      if (seq[i] !== '\\') { i++; continue }
      var code = seq[i + 1]
      if (!code) break
      if (code === '\\') { i += 2; continue }
      if (code === 'f') {
        var d = seq[i + 2]
        var fieldCode = (d && /^[1-9]$/.test(d)) ? 'f' + d : 'f1'
        if (sensitiveCodes.indexOf(fieldCode) >= 0) return true
        i += (d && /^[0-9]$/.test(d)) ? 3 : 2
      } else if (code === 'w' || code === 'W') {
        var j = i + 2, count = 0
        while (j < seq.length && count < 3 && /^[0-9]$/.test(seq[j])) { j++; count++ }
        i = count ? j : i + 2
      } else {
        if (sensitiveCodes.indexOf(code) >= 0) return true
        i += 2
      }
    }
    return false
  }

  function sendError(message) {
    $header.style.display = 'none'
    $records.style.display = 'none'
    $status.textContent = ''
    var errEl = document.createElement('div')
    errEl.className = 'err'
    errEl.textContent = message
    document.getElementById('app').appendChild(errEl)
    if (window.opener) window.opener.postMessage({ type: 'error', message: message }, '*')
    setTimeout(function() { window.close() }, 3000)
  }

  function canonicalURL(href) {
    var s = href || ''
    var pfxs = ['https://', 'http://']
    for (var i = 0; i < pfxs.length; i++) {
      if (s.toLowerCase().indexOf(pfxs[i]) === 0) { s = s.slice(pfxs[i].length); break }
    }
    var h = s.indexOf('#'); if (h >= 0) s = s.slice(0, h)
    var q = s.indexOf('?'); if (q >= 0) s = s.slice(0, q)
    s = s.toLowerCase()
    var sl = s.indexOf('/')
    if (sl >= 0) s = s.slice(0, sl).replace(/^www\./, '') + s.slice(sl)
    else s = s.replace(/^www\./, '')
    return s.replace(/\/+$/, '')
  }

})()
</script>
</body>
</html>
