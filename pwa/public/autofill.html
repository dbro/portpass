<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:7577; object-src 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Portpass autofill</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="icon.svg">
<style>
* { box-sizing: border-box; margin: 0; padding: 0 }
:root {
  --bg: #14161a; --surface: #1c1f24; --surface-2: #262a31;
  --border: #2c3038; --text: #f1ede4; --text-muted: #a6a39b;
  --text-soft: #757279; --amber: #d9a358; --amber-bg: #3a2e1a;
  --accent: #d9a358; --accent-strong: #e6b572; --accent-soft: #3a2e1a; --accent-on: #1a1407;
  --success: #6cba8a; --green-bg: #1a3025;
  --red: #e08673; --orange: #c47030;
}
body {
  font-family: system-ui, -apple-system, sans-serif;
  font-size: 14px; background: var(--bg); color: var(--text);
  height: 100dvh; overflow: hidden;
}
#app { height: 100%; display: flex; flex-direction: column; }

/* ── Header ── */
#pp-header {
  display: flex; align-items: center; gap: 8px;
  padding: 0 14px; height: 46px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
#pp-header img { width: 22px; height: 22px; border-radius: 5px }
#pp-header .pp-brand { font-weight: 600; font-size: 15px }
#pp-search-toggle {
  margin-left: auto; background: none; border: none; cursor: pointer;
  color: var(--text-muted); display: flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 6px; flex-shrink: 0; padding: 0;
}
#pp-search-toggle:hover { color: var(--text); background: var(--surface-2) }
#pp-search-toggle.active { color: var(--amber) }
#pp-search-bar {
  padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
}

/* ── Sub-header (pick phase only) ── */
#pp-subheader {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 14px; height: 36px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.pp-action-label {
  font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-muted); flex-shrink: 0;
}
.pp-current-url {
  font-family: ui-monospace, monospace; font-size: 11px;
  color: var(--text-soft); overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; max-width: 200px;
}

/* ── Content area ── */
#pp-content { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }

/* ── Picker rows ── */
.rec-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px 8px 10px; cursor: pointer;
  border-bottom: 1px solid var(--border); min-height: 40px;
  border-left: 3px solid transparent; transition: background 0.1s;
}
.rec-row:hover { background: var(--amber-bg); border-left-color: var(--amber) }
.rec-marker { width: 16px; flex-shrink: 0; display: flex; align-items: center }
.rec-name {
  flex: 1; min-width: 0; font-weight: 600; font-size: 13px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rec-url {
  width: 150px; flex-shrink: 0; font-family: ui-monospace, monospace;
  font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--text-muted);
}
.rec-url.url-saved { color: var(--text-muted) }
.rec-match-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 100px;
  background: var(--amber-bg); color: var(--amber);
  font-size: 12px; font-weight: 600; flex-shrink: 0; white-space: nowrap;
}
.rec-pencil {
  width: 22px; height: 22px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--border); border-radius: 5px;
  background: var(--surface-2); cursor: pointer; color: var(--text-muted);
}
.rec-pencil:hover { border-color: var(--text-muted) }
.rec-pencil.pencil-saved { border-color: var(--success); background: var(--green-bg); color: var(--success) }

/* ── SelectedRecordRow (waiting / done / error phases) ── */
.selected-record-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; background: var(--amber-bg);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}

/* ── Phase center (waiting / done / error content) ── */
.pp-phase-center {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; padding: 24px; text-align: center;
}

/* Waiting illustration */
.pp-waiting-illus { opacity: 0.35; color: var(--text-muted) }

/* Done circle */
.pp-done-circle {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--amber-bg);
  display: flex; align-items: center; justify-content: center;
  color: var(--amber);
}
.pp-done-title { font-size: 18px; font-weight: 700; color: var(--amber) }
.pp-done-sub   { font-size: 13px; color: var(--text-muted) }

/* Waiting text */
.pp-waiting-title { font-size: 16px; font-weight: 700 }
.pp-waiting-sub   { font-size: 13px; color: var(--text-muted); line-height: 1.5 }

/* Error */
.pp-error-icon-wrap { display: flex; align-items: center; justify-content: center }
.pp-error-title { font-size: 15px; font-weight: 700 }
.pp-error-body  { font-size: 13px; color: var(--text-muted) }
.pp-error-action {
  font-size: 13px; font-weight: 600; color: var(--amber);
  text-decoration: none; display: inline-block; margin-top: 4px;
}
.pp-error-action:hover { text-decoration: underline }

/* ── Autotype chip display (waiting phase) ── */
.pp-chips-row {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 5px; padding: 8px 12px; max-width: 100%;
  background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 8px;
}
.pp-chip {
  display: inline-flex; align-items: center; gap: 2px;
  border-radius: 100px; padding: 3px 8px;
  font-size: 11px; font-weight: 500; white-space: nowrap;
}
.pp-chip-field   { background: var(--amber-bg); color: var(--amber); font-weight: 600 }
.pp-chip-nav     { background: var(--surface);  color: var(--text-muted) }
.pp-chip-literal { border: 1px solid var(--border); color: var(--text);
                   font-family: ui-monospace, monospace; font-weight: 400 }
.pp-chip-wait    { border: 1px solid var(--border); color: var(--text-muted) }
.pp-chip-unknown { border: 1.5px solid var(--orange); color: var(--orange) }
.pp-chip-error   { border: 1.5px solid var(--red);    color: var(--red) }
.pp-chip-sep     { color: var(--text-soft); font-size: 11px; user-select: none }
.pp-chip-suffix  { font-size: 9px; opacity: 0.55 }

/* ── View-in-Portpass link (below amber banner) ── */
.pp-view-link-bar {
  display: flex; justify-content: flex-end;
  padding: 5px 14px; flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.pp-view-link {
  font-size: 11px; color: var(--text-soft);
  background: none; border: none; cursor: pointer;
  font-family: inherit; padding: 0;
}
.pp-view-link:hover { color: var(--text-muted) }

/* ── Footer (waiting phase) ── */
.pp-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 14px; border-top: 1px solid var(--border); flex-shrink: 0;
}
.pp-footer-btn {
  background: none; border: none; cursor: pointer;
  font-size: 14px; color: var(--text-muted); font-family: inherit; padding: 4px 0;
}
.pp-footer-btn:hover { color: var(--text) }

/* ── Search / no-match ── */
.pp-notice {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 14px; font-size: 11px; color: var(--text-muted);
  background: var(--surface-2); border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.pp-search-wrap { padding: 10px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0 }
.pp-search {
  width: 100%; padding: 8px 10px; background: var(--surface);
  border: 1.5px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: inherit; font-size: 13px; outline: none;
}
.pp-search:focus { border-color: var(--amber) }
.pp-section-hdr {
  padding: 5px 14px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--text-soft); border-bottom: 1px solid var(--border);
  text-transform: uppercase; flex-shrink: 0;
}
.pp-placeholder {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 6px; color: var(--text-muted);
  font-size: 13px; padding: 24px; text-align: center;
}
.pp-status { padding: 12px 14px; font-size: 13px; color: var(--text-muted) }
.pp-error-inline { padding: 12px 14px; font-size: 13px; color: var(--red) }

/* ── Selected credential panel ── */
.pp-record-head {
  display:flex; align-items:center; justify-content:space-between;
  min-height:40px; padding:0 18px; background:var(--accent-soft);
  border-bottom:1px solid var(--border); flex-shrink:0;
}
.pp-record-back {
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  width:24px; height:24px; margin-right:4px; padding:0; border:0; border-radius:5px;
  color:var(--accent); background:none; cursor:pointer;
}
.pp-record-back:hover { background:var(--surface-2) }
.pp-record-title { flex:1; min-width:0; font-size:13px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.pp-view-record {
  display:flex; align-items:center; gap:5px; color:var(--accent); border:0; background:none;
  font:inherit; font-size:12px; font-weight:700; cursor:pointer;
}
.pp-panel { display:flex; flex-direction:column; min-height:0 }
.pp-autofill-summary {
  display:flex; align-items:center; gap:14px; padding:12px 17px 9px;
  font-size:12px; flex-shrink:0; cursor:pointer;
}
.pp-autofill-summary.active { background:var(--accent-soft); border-left:3px solid var(--accent); padding-left:14px }
.pp-autofill-label { font-weight:800; letter-spacing:.04em; color:var(--text); flex-shrink:0 }
.pp-sequence { margin-left:auto; color:var(--accent); text-align:right; line-height:1.35 }
.pp-sequence.warn { color:var(--orange) }
.pp-arm {
  display:flex; align-items:center; gap:10px; min-height:49px; padding:8px 17px;
  border-left:3px solid var(--accent); background:var(--accent-soft); color:var(--accent);
  border-top:0; border-right:0; border-bottom:0; width:100%; text-align:left;
  font:inherit; cursor:pointer;
}
.pp-arm-icon { font-size:18px; flex-shrink:0 }
.pp-arm-text { flex:1; min-width:0; font-size:13px }
.pp-arm-text strong { font-weight:800 }
.pp-insert-divider {
  display:flex; align-items:center; gap:10px; padding:11px 16px 5px;
  color:var(--text-soft); font-size:11px; font-weight:800; letter-spacing:.08em; flex-shrink:0;
}
.pp-insert-divider:before,.pp-insert-divider:after { content:""; height:1px; background:var(--border); flex:1 }
.pp-field-row { padding:0 17px; cursor:pointer }
.pp-field-main {
  min-height:41px; display:flex; align-items:center; gap:10px;
}
.pp-field-label { color:var(--text); font-size:13px; font-weight:700; flex:1; min-width:0 }
.pp-field-value {
  color:var(--text-muted); font:12px ui-monospace,monospace; max-width:190px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pp-field-action {
  border:0; background:none; color:var(--text-muted); cursor:pointer; display:flex; padding:2px;
}
.pp-field-row.active { padding:0 }
.pp-field-row.active .pp-field-main { padding:0 17px; background:var(--accent-soft) }
.pp-field-row.active .pp-arm { min-height:42px }
.pp-notes .pp-field-main { min-height:36px; padding-top:7px }
.pp-notes-value {
  display:block; width:100%; max-width:none; padding:0 0 9px;
  white-space:pre-wrap; line-height:1.4; max-height:90px; overflow:auto;
}
.pp-totp-bar { height:2px; background:var(--border); overflow:hidden }
.pp-totp-bar-fill { height:100%; background:var(--accent); transition:width 1s linear }
</style>
</head>

  </div>

    <input id="pp-search-input" class="pp-search" type="text" placeholder="Search all passwords…">
  </div>

    <span class="pp-action-label">CLICK TO AUTOFILL</span>
    <span id="pp-url-display" class="pp-current-url"></span>
  </div>
  <div id="pp-content">
    <div class="pp-status">Connecting to Portpass…</div>

</div>

      if (!q) { showPickerSearchPlaceholder(); return }

  }())

  function setStatus(msg) {

  var PAIR_BASE32 = 'abcdefghijklmnopqrstuvwxyz234567'

    showPairingSetup()

  crypto.subtle.generateKey(
    { name: 'ECDH', namedCurve: 'P-256' }, true, ['deriveKey']
  ).then(function(kp) {
    cpEcdhKeyPair = kp
    return crypto.subtle.exportKey('spki', kp.publicKey)
  }).then(function(spki) {
    cpEcdhSpkiB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(spki)))

    window.addEventListener('message', onOpenerMessage)
    // Also listen for fill-related messages from bookmarklet (field-clicked, fill-done, fill-error)
    window.addEventListener('message', onBookmarkletMessage)
  }).catch(function() { sendError('Startup failed') })

  // ── Ping Dashboard via BroadcastChannel ───────────────────────────────────
  ch.onmessage = function(e) {
    if (e.data && e.data.type === 'pong' && e.data.nonce === pingNonce) {
      bcPongCount++
      scheduleDecide(50)
    }
  }

  function onOpenerMessage(event) {
    if (!window.opener || event.source !== window.opener) return
    var msg = event.data
    if (!msg || msg.type !== 'init') return
    window.removeEventListener('message', onOpenerMessage)

    bookmarkletOrigin = event.origin
    currentUrl = msg.url || ''
    saveUrl = msg.saveUrl || currentUrl
    isSecure = !!msg.isSecure
    delegateId = msg.delegateId || null
    if (msg.relayUrl) wsRelayUrl = msg.relayUrl.replace(/^http/, 'ws').replace(/\/ws$/, '') + '/ws'

    if ($urlDisplay) { $urlDisplay.textContent = currentUrl; $urlDisplay.title = currentUrl }

    if (currentUrl) {
      try {
        var sentHost = currentUrl.split('/')[0]
        var evHost = new URL(event.origin).host.replace(/^www\./, '').toLowerCase()
        if (evHost && sentHost !== evHost) { sendError('URL mismatch — security check failed'); return }
      } catch(_) {}
    }

    loadPairedProfile(delegateId).then(function(profile) {
      pairedProfile = profile
      if (!pairedProfile) { sendError('Autofill profile is not paired — create a new bookmarklet in Portpass'); return }
      cpPubSpkiB64 = pairedProfile.publicKeyB64 || btoa(String.fromCharCode.apply(null, new Uint8Array(pairedProfile.publicKey || [])))

  function onBookmarkletMessage(event) {
    if (!window.opener || event.source !== window.opener) return
    var msg = event.data
    if (!msg) return
    if (msg.type === 'field-clicked') {
      fieldClicked = true
      pendingFill()
    } else if (msg.type === 'fill-done') {
      var mode = msg.mode || pendingFillMode
      pendingFillMode = null
      if (mode === 'single') {
        ;(pendingCredentials.fields || []).forEach(function(field) {
          if (field.sensitive) field.revealed = false
        })
        armedCode = null
        fieldClicked = false
        showWaiting(pendingCredentials)
      } else {
        showDone()
      }
    } else if (msg.type === 'fill-error') {
      showErrorPhase(detectErrorPhase(msg.error || ''))
    }
  }

  // ── Parallel probe: BC + WebSocket relay ─────────────────────────────────

  function scheduleDecide(ms) {
    if (probeDecided || probeTimer === null) return
    clearTimeout(probeTimer)
    if (ms === 0) { decideTransport(); return }
    probeTimer = setTimeout(decideTransport, ms)
  }

  function startProbe() {
    startWsProbe()  // async — runs in background during the collection window
    probeTimer = setTimeout(decideTransport, 2000)  // fallback if no response
  }

  async function startWsProbe() {
    if (!pairedProfile || !pairedProfile.signingKey) return
    try {
      cpSigningKey = pairedProfile.signingKey
      setupWsTransport()

      var ts = Date.now()
      var signedPayload = JSON.stringify({ version: 1, sender: delegateId || '', recipient: pairedProfile.dashboardId || '', url: currentUrl, nonce: pingNonce, ecdh: cpEcdhSpkiB64, ts: ts, msgType: '', uuid: '', vaultUuid: '', query: '' })
      var sigBytes = await crypto.subtle.sign(
        { name: 'ECDSA', hash: 'SHA-256' }, cpSigningKey, new TextEncoder().encode(signedPayload)
      )
      var sigB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(sigBytes)))

      wsProbeWs = new WebSocket(wsRelayUrl)
      wsProbeWs.onopen = function() {
        wsProbeWs.send(JSON.stringify({
          type: 'publish', channel: 'portpass-autofill', replyTo: pingNonce,
          delegateId: delegateId, url: currentUrl, ecdh: cpEcdhSpkiB64, ts: ts, sig: sigB64, pub: cpPubSpkiB64
        }))
      }
      wsProbeWs.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data)
          if (msg.type === 'reply') {
            wsProbeReplies.push(msg)
            scheduleDecide(50)
          } else if (msg.type === 'error') {
            wsProbeError = msg.message || 'Relay error'
            scheduleDecide(0)
          }
        } catch(_) {}
      }
      wsProbeWs.onerror = function() {
        wsProbeError = 'Cannot connect to websocket relay'
        scheduleDecide(0)
      }
      wsProbeWs.onclose = function() {}
    } catch(e) { wsProbeError = e.message }
  }

  function setupWsTransport() {
    $transport = {
      search: async function(q) {
        var blob = await cpSignAndSend('search', { url: q, query: q })
        return decryptReply(blob, blob.replyTo)
      },
      fill: async function(uuid, vu) {
        var blob = await cpSignAndSend('fill-uuid', { url: currentUrl, uuid: uuid, vaultUuid: vu || null })
        var results = await decryptReply(blob, blob.replyTo)
        if (!results || !results.length) throw new Error('Could not get credentials')
        return results[0]
      },
      fieldValue: async function(uuid, vu, code) {
        var blob = await cpSignAndSend('field-value', { url: currentUrl, uuid: uuid, vaultUuid: vu || null, query: code })
        return decryptReply(blob, blob.replyTo)
      },
      viewRecord: function(uuid, vu) {
        return cpSignAndSend('view-record', { url: uuid, uuid: uuid, vaultUuid: vu || null })
      },
      viewNearMatches: function() {
        return cpSignAndSend('view-near-matches', { url: currentUrl })
      },
      saveUrl: function(uuid, vu) { wsSaveUrl(uuid, vu) },
      notifyFilled: function() { wsNotifyFilled() }
    }
  }

  function decideTransport() {
    if (probeDecided) return
    probeDecided = true
    if (wsProbeWs) { try { wsProbeWs.close() } catch(_) {} wsProbeWs = null }
    var bcCount = bcPongCount
    var wsCount = wsProbeReplies.length

    if (bcCount > 1 || wsCount > 1) {
      showErrorPhase('multiinstance')
      if (window.opener && bookmarkletOrigin) {
        try { window.opener.postMessage({ type: 'cancel' }, bookmarkletOrigin) } catch(_) {}
      }
      return
    }
    if (bcCount === 0 && wsCount === 0) {
      sendError(wsProbeError || 'Cannot connect to websocket relay')
      return
    }
    // Prefer BC when available — same instance may respond on both channels if cross-profile is enabled
    if (bcCount >= 1) { doHello(); return }
    processRelayBlob(wsProbeReplies[0])
  }

  function wsPost(requestMsg) {
    return new Promise(function(resolve, reject) {
      var ws
      try { ws = new WebSocket(wsRelayUrl) } catch(e) {
        reject(new Error('Invalid relay server URL — check settings')); return
      }
      var settled = false
      function done(fn, arg) { if (!settled) { settled = true; ws.close(); fn(arg) } }
      ws.onopen    = function() { ws.send(JSON.stringify(requestMsg)) }
      ws.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data)
          if (msg._switchboard_origin !== location.origin) return
          if (msg.type === 'error') done(reject, new Error(msg.message || 'Autofill failed'))
          else if (msg.type === 'reply') done(resolve, msg)
        } catch(_) { done(reject, new Error('Invalid relay message')) }
      }
      ws.onerror = function() { done(reject, new Error('Cannot connect to websocket relay')) }
      ws.onclose = function() { if (!settled) done(reject, new Error('relay server closed unexpectedly')) }
    })
  }

  async function decryptReply(blob, expectedRequestId) {
    var ephPubJwk = JSON.parse(atob(blob.ephPub))
    var ephPubKey = await crypto.subtle.importKey('jwk', ephPubJwk, { name: 'ECDH', namedCurve: 'P-256' }, false, [])
    var cpSessionKey = await crypto.subtle.deriveKey(
      { name: 'ECDH', public: ephPubKey }, cpEcdhKeyPair.privateKey,
      { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    )
    var iv = Uint8Array.from(atob(blob.iv), function(c) { return c.charCodeAt(0) })
    var ct = Uint8Array.from(atob(blob.ciphertext), function(c) { return c.charCodeAt(0) })
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, cpSessionKey, ct)
    var parsed = JSON.parse(new TextDecoder().decode(pt))
    if (parsed && parsed.v === 1 && Object.prototype.hasOwnProperty.call(parsed, 'data')) {
      if (expectedRequestId && parsed.requestId !== expectedRequestId) throw new Error('Relay reply did not match request')
      if (parsed.delegateId && delegateId && parsed.delegateId !== delegateId) throw new Error('Relay reply was for a different delegate')
      if (parsed.recipient && parsed.recipient !== 'autofill-popup') throw new Error('Relay reply was for a different recipient')
      return parsed.data
    }
    return parsed
  }

  async function processRelayBlob(blob) {
    if (blob.error) { sendError(blob.error); return }
    try {
      var data = await decryptReply(blob, blob.replyTo)
      if (data && data.records) {
        applyTheme(data.theme === 'dark', data.accent || 'amber')
        if ((!data.records || !data.records.length) && data.nearMatchCount !== undefined) showNearMatchSummary(data.nearMatchCount)
        else showPicker(data.records)
      } else {
        showPicker(data || [])
      }
    } catch(e) { sendError('Decrypt failed: ' + e.message) }
  }

  async function cpSignAndSend(msgType, extraFields) {
    var ts = Date.now()
    var reqNonce = crypto.randomUUID()
    var signedPayload = JSON.stringify({ version: 1, sender: delegateId || '', recipient: pairedProfile?.dashboardId || '', url: extraFields.url || '', nonce: reqNonce, ecdh: cpEcdhSpkiB64, ts: ts,
      msgType: msgType, uuid: extraFields.uuid || '', vaultUuid: extraFields.vaultUuid || '', query: extraFields.query || '' })
    var sigBytes = await crypto.subtle.sign(
      { name: 'ECDSA', hash: 'SHA-256' }, cpSigningKey, new TextEncoder().encode(signedPayload)
    )
    var sigB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(sigBytes)))
    return wsPost(Object.assign({
      type: 'publish', channel: 'portpass-autofill', replyTo: reqNonce,
      delegateId: delegateId, msgType: msgType, ecdh: cpEcdhSpkiB64, ts: ts, sig: sigB64, pub: cpPubSpkiB64
    }, extraFields))
  }

  async function doSearch(query) {

  function loadPairedProfile(id) {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open('keyval-store')
      req.onerror = function() { reject(req.error || new Error('IndexedDB unavailable')) }
      req.onsuccess = function() {
        var db = req.result
        try {
          var tx = db.transaction('keyval', 'readonly')
          var store = tx.objectStore('keyval')
          var gr = store.get('paired-autofill-profiles-v1')
          gr.onerror = function() { reject(gr.error || new Error('Pairing storage unavailable')) }
          gr.onsuccess = function() {
            var all = gr.result || {}
            var delegateKey = id || all.defaultDelegateId
            resolve(delegateKey ? (all[delegateKey] || null) : null)
          }
        } catch(e) { reject(e) }
      }
    })
  }

  function savePairedProfile(profile) {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open('keyval-store')
      req.onerror = function() { reject(req.error || new Error('IndexedDB unavailable')) }
      req.onupgradeneeded = function() {
        var db = req.result
        if (!db.objectStoreNames.contains('keyval')) db.createObjectStore('keyval')
      }
      req.onsuccess = function() {
        var db = req.result
        try {
          var tx = db.transaction('keyval', 'readwrite')
          var store = tx.objectStore('keyval')
          var gr = store.get('paired-autofill-profiles-v1')
          gr.onerror = function() { reject(gr.error || new Error('Pairing storage unavailable')) }
          gr.onsuccess = function() {
            var all = gr.result || {}
            all[profile.delegateId] = profile
            all.defaultDelegateId = profile.delegateId
            var pr = store.put(all, 'paired-autofill-profiles-v1')
            pr.onerror = function() { reject(pr.error || new Error('Pairing storage unavailable')) }
            pr.onsuccess = function() { resolve(profile) }
          }
        } catch(e) { reject(e) }
      }
    })
  }

  function pairBase32(bytes) {
    var out = '', bits = ''
    for (var i = 0; i < bytes.length; i++) {
      bits += bytes[i].toString(2).padStart(8, '0')
      while (bits.length >= 5) {
        out += PAIR_BASE32[parseInt(bits.slice(0, 5), 2)]
        bits = bits.slice(5)
      }
    }
    if (bits.length > 0) out += PAIR_BASE32[parseInt(bits.padEnd(5, '0'), 2)]
    return out
  }

  function pairBytesToB64(bytes) {
    return btoa(String.fromCharCode.apply(null, new Uint8Array(bytes)))
  }

  function pairB64url(s) {
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')
  }

  async function identityFromPairingPublicKey(publicKeySpki) {
    var digest = new Uint8Array(await crypto.subtle.digest('SHA-256', publicKeySpki))
    var fp = pairBase32(digest.slice(0, 16))
    return {
      delegateId: 'afp1_' + fp,
      displayCode: fp.slice(-8).replace(/(.{4})/g, '$1-').replace(/-$/, '').toUpperCase(),
    }
  }

  function pairingTokenForProfile(profile, name) {
    var now = Date.now()
    var token = {
      v: 1,
      type: 'portpass-autofill-pairing',
      delegateId: profile.delegateId,
      displayCode: profile.displayCode,
      name: name || '',
      publicKeyB64: profile.publicKeyB64,
      relayUrl: profile.relayUrl || '',
      pairingId: profile.pairingId,
      created: profile.created,
      expires: now + 10 * 60 * 1000,
    }
    return 'ppair1_' + pairB64url(JSON.stringify(token))
  }

  async function createPairingProfile(relayUrl) {
    var keyPair = await crypto.subtle.generateKey(
      { name: 'ECDSA', namedCurve: 'P-256' }, false, ['sign', 'verify']
    )
    var spki = await crypto.subtle.exportKey('spki', keyPair.publicKey)
    var identity = await identityFromPairingPublicKey(spki)
    var profile = {
      delegateId: identity.delegateId,
      displayCode: identity.displayCode,
      dashboardId: 'local-dashboard',
      relayUrl: relayUrl || '',
      pairingId: crypto.randomUUID(),
      created: Date.now(),
      signingKey: keyPair.privateKey,
      publicKey: Array.from(new Uint8Array(spki)),
      publicKeyB64: pairBytesToB64(spki),
    }
    return savePairedProfile(profile)
  }

  function makeDelegateBookmarkletUrl(portpassUrl, delegateId, relayUrl) {
    var origin = new URL(portpassUrl).origin
    return 'javascript:' + encodeURIComponent(
      '(' + DELEGATE_BOOKMARKLET_IIFE.toString() + ')(' +
      JSON.stringify(portpassUrl) + ',' +
      JSON.stringify(origin) + ',' +
      JSON.stringify(delegateId) + ',' +
      JSON.stringify(relayUrl) + ')'
    )
  }

  function DELEGATE_BOOKMARKLET_IIFE(PORTPASS_URL, PORTPASS_ORIGIN, DELEGATE_ID, RELAY_URL) {

    var saveUrl = window.location.origin + window.location.pathname
    var AUTOFILL_URL = PORTPASS_URL + 'autofill.html'

    var startEl = null

    function cleanup() {
      if (cleanedUp) return

      window.removeEventListener('message', onPopupMessage)

    function onFieldClick(e) {
      var target = e.target
      if (!isUsableInput(target)) return

      startEl = target
      try { pp.postMessage({ type: 'field-clicked' }, PORTPASS_ORIGIN) } catch(_) {}
    }
    function onPopupMessage(e) {
      if (!pp || e.source !== pp) return
      var msg = e.data
      if (!msg) return

        var el = startEl
        executeAutotype(el, msg.autotype, msg.fields).then(function() {
          try { pp.postMessage({ type: 'fill-done', mode: msg.mode }, PORTPASS_ORIGIN) } catch(_) {}
          try { pp.focus() } catch(_) {}

            startEl = null
            document.addEventListener('click', onFieldClick, true)
          } else {
            cleanup()
          }

      } else if (msg.type === 'cancel') cleanup()
    }
    ;(async function run() {
      try {
        var ppW = 380, ppH = 480
        var ppLeft = screen.width - ppW - 24
        pp = window.open(AUTOFILL_URL, 'portpass_autofill', 'popup=yes,width=' + ppW + ',height=' + ppH + ',left=' + ppLeft + ',top=24')
        if (!pp) { cleanup(); return }
        var readyMsg
        try { readyMsg = await recv(pp, ['ready', 'error'], 10000) }
        catch (_) { try { pp.close() } catch (_2) {}; cleanup(); return }
        if (readyMsg.type === 'error') { cleanup(); return }
        pp.postMessage({
          type: 'init',
          url: currentCanonical,
          saveUrl: saveUrl,
          isSecure: isSecure,
          delegateId: DELEGATE_ID,
          relayUrl: RELAY_URL,
        }, PORTPASS_ORIGIN)
        window.addEventListener('message', onPopupMessage)
        document.addEventListener('click', onFieldClick, true)
        var closeCheck = setInterval(function() {
          if (pp && pp.closed) { clearInterval(closeCheck); cleanup() }
        }, 500)
      } catch (e) { cleanup() }
    })()
    function recv(target, types, timeout) {
      timeout = timeout || 5000
      return new Promise(function(resolve, reject) {
        var t = setTimeout(function() {

        function handler(e) {

          if (types.indexOf(e.data && e.data.type) >= 0) {

            resolve(e.data)
          }

        window.addEventListener('message', handler)

    }
    function canonicalURL(href) {
      var s = href || ''
      var pfxs = ['https://', 'http://']
      for (var i = 0; i < pfxs.length; i++) {
        if (s.toLowerCase().indexOf(pfxs[i]) === 0) { s = s.slice(pfxs[i].length); break }
      }
      var h = s.indexOf('#'); if (h >= 0) s = s.slice(0, h)
      var q = s.indexOf('?'); if (q >= 0) s = s.slice(0, q)
      s = s.toLowerCase()
      var sl = s.indexOf('/')
      if (sl >= 0) s = s.slice(0, sl).replace(/^www\./, '') + s.slice(sl)

        else if (code === 'v' && seq[i + 2] === '{') {

          var j = i + 2, count = 0
          while (j < seq.length && count < 3 && /^[0-9]$/.test(seq[j])) { j++; count++ }
          tokens.push({ type: 'delay', ms: (parseInt(seq.slice(i + 2, j)) || 0) * (code === 'W' ? 1000 : 1) }); i = j
        } else if ('uptmn2s'.indexOf(code) >= 0) {
          if (lit) { tokens.push({ type: 'lit', text: lit }); lit = '' }
          tokens.push({ type: 'code', code: code }); i += 2
        } else i += 2
      }
      if (lit) tokens.push({ type: 'lit', text: lit })
      return tokens
    }
    function isUsableInput(el) {
      if (!el) return false
      var tag = el.tagName
      if (tag !== 'INPUT' && tag !== 'TEXTAREA') return false
      if (el.disabled || el.type === 'hidden') return false
      if (['submit', 'button', 'reset', 'image', 'checkbox', 'radio'].indexOf(el.type) >= 0) return false
      var s = getComputedStyle(el)
      return s.display !== 'none' && s.visibility !== 'hidden'
    }
    function fillField(el, value) {
      var proto = el.tagName === 'TEXTAREA' ? HTMLTextAreaElement.prototype : HTMLInputElement.prototype
      var setter = Object.getOwnPropertyDescriptor(proto, 'value')
      if (setter && setter.set) setter.set.call(el, value)
      el.dispatchEvent(new Event('input', { bubbles: true }))
      el.dispatchEvent(new Event('change', { bubbles: true }))
    }
    function focusableList() {
      var q = 'input:not([disabled]):not([type=hidden]):not([type=submit]):not([type=button]):not([type=reset]):not([type=image]):not([type=checkbox]):not([type=radio]),textarea:not([disabled])'
      var all = Array.from(document.querySelectorAll(q)).filter(function(e) {
        var s = getComputedStyle(e)
        return e.tabIndex >= 0 && s.display !== 'none' && s.visibility !== 'hidden'
      })
      return all.filter(function(e) { return e.tabIndex > 0 }).sort(function(a, b) { return a.tabIndex - b.tabIndex }).concat(all.filter(function(e) { return e.tabIndex === 0 }))
    }
    function nextFocusable(el) {
      var sorted = focusableList()
      var i = sorted.indexOf(el)
      return i >= 0 ? sorted[i + 1] || null : null
    }
    function prevFocusable(el) {
      var sorted = focusableList()
      var i = sorted.indexOf(el)
      return i > 0 ? sorted[i - 1] : null
    }
    async function executeAutotype(startEl, sequence, fields) {
      var tokens = parseAutotype(sequence)
      var el = startEl
      for (var i = 0; i < tokens.length; i++) {
        var tok = tokens[i]
        if (tok.type === 'delay') await new Promise(function(r) { setTimeout(r, tok.ms) })
        else if (tok.type === 'lit' || tok.type === 'v') {
          if (el) fillField(el, tok.type === 'v' ? (fields['v{' + tok.name + '}'] || '') : tok.text)
        } else {
          var code = tok.code
          if (code === 'u' || code === 'p' || code === 'm' || code === '2') {
            if (el) fillField(el, fields[code] || '')
          } else if (code === 't') {
            var next = nextFocusable(el)
            if (next) { if (el) el.dispatchEvent(new Event('blur', { bubbles: true })); next.focus(); el = next }
          } else if (code === 's') {
            var prev = prevFocusable(el)
            if (prev) { if (el) el.dispatchEvent(new Event('blur', { bubbles: true })); prev.focus(); el = prev }
          } else if (code === 'n') {
            if (el) ['keydown', 'keypress', 'keyup'].forEach(function(evType) {
              el.dispatchEvent(new KeyboardEvent(evType, { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true, cancelable: true }))
            })
            var form = el && el.closest('form')
            var submitBtn = (form && form.querySelector('[type=submit]')) || (form && form.querySelector('[default-button]'))
            if (!submitBtn && form) {
              var btns = Array.from(form.querySelectorAll('button:not([type=reset])'))
              if (btns.length === 1) submitBtn = btns[0]
            }
            if (submitBtn) submitBtn.click()
            else if (form) try { form.requestSubmit() } catch (_) { try { form.submit() } catch (_2) {} }
          }
        }
      }
    }
  }

  // ── Record selection — shared entry point ──────────────────────────────────
  // Called when a picker row is clicked (or auto-advanced for single exact match).
  function selectRecord(rec, fromPhase) {
    chosen = rec
    previousPhase = fromPhase   // null → no Back button
    fieldClicked = false
    pendingCredentials = null
    armedCode = 'sequence'
    showWaiting(null)
    $transport.fill(rec.uuid, rec.vaultUuid).then(function(cred) {
      if (chosen !== rec) return
      if (!cred) { sendError('Could not get credentials'); return }
      pendingCredentials = cred
      showWaiting(cred)
    }).catch(function(e) { sendError(e.message || 'Autofill failed') })
  }

  function fieldByCode(code) {
    return pendingCredentials && (pendingCredentials.fields || []).find(function(f) { return f.code === code })
  }

  function loadFieldValue(code) {
    var field = fieldByCode(code)
    if (!field) return Promise.resolve('')
    if (code !== '2' && Object.prototype.hasOwnProperty.call(field, 'value')) return Promise.resolve(field.value || '')
    return $transport.fieldValue(chosen.uuid, chosen.vaultUuid || null, code).then(function(result) {
      field.value = result && Object.prototype.hasOwnProperty.call(result, 'value') ? result.value : ''
      if (code === '2') {
        field.seconds = result && result.seconds
        field.period = result && result.period
      }
      return field.value
    })
  }

  function sequenceFieldCodes(seq) {
    var codes = [], toks = parseAutotypeTokens(seq || '')
    toks.forEach(function(tok) {
      if (tok.code && codes.indexOf(tok.code) < 0) codes.push(tok.code)
    })
    return codes
  }

  function armField(code) {
    if (armedCode === code) {
      armedCode = null
      fieldClicked = false
      showWaiting(pendingCredentials)
      return
    }
    armedCode = code
    fieldClicked = false
    var field = fieldByCode(code)
    // OTP values age quickly: fetch them only when revealed or immediately before insertion.
    if (field && field.sensitive && code !== '2') loadFieldValue(code).catch(function(e) { sendError(e.message || 'Could not get field value') })
    showWaiting(pendingCredentials)
  }

  function armSequence() {
    armedCode = armedCode === 'sequence' ? null : 'sequence'
    fieldClicked = false
    showWaiting(pendingCredentials)
  }

  function updateOtpRefresh() {
    if (otpRefreshTimer) { clearInterval(otpRefreshTimer); otpRefreshTimer = null }
    var otp = fieldByCode('2')
    if (!otp || !otp.revealed) return
    otpRefreshTimer = setInterval(function() {
      loadFieldValue('2').then(function() {
        if (!otp.revealed) return
        var row = $content.querySelector('.pp-field-row[data-code="2"]')
        var value = row && row.querySelector('.pp-field-value')
        var fill = row && row.querySelector('.pp-totp-bar-fill')
        if (value) value.textContent = otp.value || ''
        if (fill) fill.style.width = ((otp.seconds || 0) / otp.period * 100) + '%'
      }).catch(function() {})
    }, 1000)
  }

  // Triggers fill only after a new host-page field click.
  async function pendingFill() {
    if (!pendingCredentials) return
    if (!fieldClicked) return

    var codes = armedCode === 'sequence' ? sequenceFieldCodes(pendingCredentials.autotype) : [armedCode]
    var hasSensitive = codes.some(function(code) { var f = fieldByCode(code); return f && f.sensitive })
    if (!isSecure && hasSensitive) {
      showErrorPhase('http')
      return
    }
    try {
      var fields = {}
      await Promise.all(codes.map(async function(code) { fields[code] = await loadFieldValue(code) }))
      var autotype = armedCode === 'sequence' ? pendingCredentials.autotype : '\\' + armedCode
      if (window.opener && bookmarkletOrigin) {
        pendingFillMode = armedCode === 'sequence' ? 'sequence' : 'single'
        window.opener.postMessage({ type: 'fill', mode: pendingFillMode, autotype: autotype, fields: fields }, bookmarkletOrigin)
      }
    } catch(e) {
      sendError(e.message || 'Could not get credentials')
    }
  }

  function detectErrorPhase(msg) {
    var lm = (msg || '').toLowerCase()
    if (/cannot connect|websocket relay|no subscriber/.test(lm))             return 'noconn'
    if (/vault.*lock|is locked/.test(lm) || /open a record/.test(lm))       return 'locked'
    if (/autofill sequence|no autofill|autotype|could not parse/.test(lm))   return 'noseq'
    if (/non-https|insecure|sensitive.*http/.test(lm))                       return 'http'
    return 'other'
  }

  // ── BroadcastChannel path ─────────────────────────────────────────────────

  async function doHello() {
    try {
      keyPair = await crypto.subtle.generateKey(
        { name: 'ECDH', namedCurve: 'P-256' }, false, ['deriveKey']
      )
      var pubJwk = await crypto.subtle.exportKey('jwk', keyPair.publicKey)
      var ecdhSpki = await crypto.subtle.exportKey('spki', keyPair.publicKey)
      var ecdhSpkiB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(ecdhSpki)))
      nonce = crypto.randomUUID()

      var sigB64 = null, pubSpkiB64 = null, helloTs = Date.now()
      if (pairedProfile && pairedProfile.signingKey) {
        try {
          var signingKey = pairedProfile.signingKey
          pubSpkiB64 = cpPubSpkiB64
          var sigBytes = await crypto.subtle.sign(
            { name: 'ECDSA', hash: 'SHA-256' }, signingKey,
            new TextEncoder().encode(JSON.stringify({ version: 1, sender: delegateId || '', recipient: pairedProfile.dashboardId || '', nonce: nonce, ecdhSpki: ecdhSpkiB64, ts: helloTs }))
          )
          sigB64 = btoa(String.fromCharCode.apply(null, new Uint8Array(sigBytes)))
        } catch(_) {}
      }

      ch.onmessage = function(e) {
        var msg = e.data
        if (!msg || msg.nonce !== nonce) return
        if (msg.type === 'hello-response') onHelloResponse(msg)
        else if (msg.type === 'error') sendError(msg.message)
      }
      var helloMsg = { type: 'hello', pubkey: pubJwk, ecdhSpki: ecdhSpkiB64, nonce: nonce, delegateId: delegateId, ts: helloTs }
      if (sigB64 && pubSpkiB64) { helloMsg.sig = sigB64; helloMsg.pub = pubSpkiB64 }
      ch.postMessage(helloMsg)
    } catch(_) { sendError('Key exchange failed') }
  }

  async function onHelloResponse(msg) {
    try {
      var ppPub = await crypto.subtle.importKey(
        'jwk', msg.pubkey, { name: 'ECDH', namedCurve: 'P-256' }, false, []
      )
      sessionKey = await crypto.subtle.deriveKey(
        { name: 'ECDH', public: ppPub }, keyPair.privateKey,
        { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      )
    } catch(_) { sendError('Key exchange failed'); return }

    ch.onmessage = onBCMessage
    $transport = {
      search: function(q) {
        return new Promise(function(resolve) {
          _pendingSearch = resolve
          ch.postMessage({ type: 'search', query: q, nonce: nonce })
        })
      },
      fill: function(uuid, vu) {
        return new Promise(function(resolve) {
          _pendingFill = resolve
          ch.postMessage({ type: 'query', uuid: uuid, vaultUuid: vu || null, nonce: nonce })
        })
      },
      fieldValue: function(uuid, vu, code) {
        return new Promise(function(resolve) {
          _pendingValue = resolve
          ch.postMessage({ type: 'field-value', uuid: uuid, vaultUuid: vu || null, code: code, nonce: nonce })
        })
      },
      viewRecord: function(uuid, vu) {
        ch.postMessage({ type: 'view-record', uuid: uuid, vaultUuid: vu || null, nonce: nonce })
      },
      saveUrl: function(uuid, vu) {
        ch.postMessage({ type: 'save-url', uuid: uuid, vaultUuid: vu || null, url: saveUrl, nonce: nonce })
      },
      notifyFilled: function() {
        ch.postMessage({ type: 'fill-done' })
      }
    }
    setStatus('Searching for matches…')
    ch.postMessage({ type: 'query', url: currentUrl, nonce: nonce })
  }

  function onBCMessage(e) {
    var msg = e.data
    if (!msg || msg.nonce !== nonce) return
    if (msg.type === 'records') {
      applyTheme(msg.theme === 'dark', msg.accent || 'amber')
      showPicker(msg.records)
      return
    }
    if (msg.type === 'record') {
      if (_pendingFill) {
        var res = _pendingFill; _pendingFill = null
        ;(async function() {
          try {
            var iv = Uint8Array.from(atob(msg.iv), function(c) { return c.charCodeAt(0) })
            var ct = Uint8Array.from(atob(msg.ciphertext), function(c) { return c.charCodeAt(0) })
            var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, sessionKey, ct)
            res(JSON.parse(new TextDecoder().decode(pt)))
          } catch(_) { res(null) }
        })()
      }
      return
    }
    if (msg.type === 'field-value') {
      if (_pendingValue) {
        var valueRes = _pendingValue; _pendingValue = null
        ;(async function() {
          try {
            var iv = Uint8Array.from(atob(msg.iv), function(c) { return c.charCodeAt(0) })
            var ct = Uint8Array.from(atob(msg.ciphertext), function(c) { return c.charCodeAt(0) })
            var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, sessionKey, ct)
            valueRes(JSON.parse(new TextDecoder().decode(pt)))
          } catch(_) { valueRes(null) }
        })()
      }
      return
    }
    if (msg.type === 'url-saved') return
    if (msg.type === 'search-results') {
      if (_pendingSearch) { var res = _pendingSearch; _pendingSearch = null; res(msg.records) }
      else if (searchOpen) showPickerSearchResults(msg.records)
      else showSearchResults(msg.records)
      return
    }
    if (msg.type === 'error') sendError(msg.message)
  }

  // ── Error handling ─────────────────────────────────────────────────────────

  function sendError(message) {
    var phase = detectErrorPhase(message)
    showErrorPhase(phase, message)
    // Also forward to bookmarklet so it can clean up, but no overlay.
    if (window.opener && bookmarkletOrigin) {
      try { window.opener.postMessage({ type: 'cancel' }, bookmarkletOrigin) } catch(_) {}
    }
  }

  // ── Shared helpers ─────────────────────────────────────────────────────────

  var PORTPASS_URL = (function() {
    var p = window.location.href
    return p.slice(0, p.lastIndexOf('/') + 1)
  }())

  function parseAutotypeTokens(seq) {
    if (!seq) return []
    var toks = [], lit = '', i = 0
    function fl() { if (lit) { toks.push({ type: 'literal', label: lit }); lit = '' } }
    while (i < seq.length) {
      if (seq[i] !== '\\') { lit += seq[i++]; continue }
      if (i + 1 >= seq.length) { fl(); toks.push({ type: 'error', label: 'trailing \\' }); break }
      var c = seq[i + 1]
      if (c === '\\') { lit += '\\'; i += 2; continue }
      fl()
      if      (c === 'u') { toks.push({ type: 'field', code: 'u', label: 'Username' }); i += 2 }
      else if (c === 'p') { toks.push({ type: 'field', code: 'p', label: 'Password' }); i += 2 }
      else if (c === 'm') { toks.push({ type: 'field', code: 'm', label: 'Email' }); i += 2 }
      else if (c === '2') { toks.push({ type: 'field', code: '2', label: 'One-time code' }); i += 2 }
      else if (c === 't') { toks.push({ type: 'nav', label: 'Tab', suffix: '→' }); i += 2 }
      else if (c === 's') { toks.push({ type: 'nav', label: 'Shift-Tab', suffix: '←' }); i += 2 }
      else if (c === 'n') { toks.push({ type: 'nav', label: 'Enter', suffix: '↵' }); i += 2 }
      else if (c === 'v') {
        if (seq[i + 2] !== '{') { toks.push({ type: 'error', label: '\\v missing {' }); i += 2 }
        else {
          var end = seq.indexOf('}', i + 3)
          if (end < 0) { toks.push({ type: 'error', label: '\\v missing }' }); i = seq.length }
          else {
            var name = seq.slice(i + 3, end)
            toks.push({ type: 'field', code: 'v{' + name + '}', label: name || 'Custom field' }); i = end + 1
          }
        }
      } else if (c === 'w' || c === 'W') {
        var j = i + 2, cnt = 0
        while (j < seq.length && cnt < 3 && /^[0-9]$/.test(seq[j])) { j++; cnt++ }
        if (cnt === 0) { toks.push({ type: 'error', label: '\\' + c + ' no digits' }); i += 2 }
        else { toks.push({ type: 'wait', label: 'Wait ' + seq.slice(i + 2, j) + (c === 'w' ? 'ms' : 's') }); i = j }
      } else { toks.push({ type: 'unknown', label: 'Unknown \\' + c }); i += 2 }
    }
    fl()
    return toks
  }

  function warnAutotype(seq) {
    if (!seq) return ''
    var supported = { u:1, p:1, t:1, n:1, m:1, 2:1, s:1, '\\':1, v:1, w:1, W:1 }
    var unknown = [], i = 0
    while (i < seq.length) {
      if (seq[i] !== '\\') { i++; continue }
      if (i + 1 >= seq.length) break
      var code = seq[i + 1]
      if (code === 'v' && seq[i + 2] === '{') {
        var end = seq.indexOf('}', i + 3)
        i = end < 0 ? seq.length : end + 1
      }
      else if (code === 'w' || code === 'W') {
        var j = i + 2, count = 0
        while (j < seq.length && count < 3 && /^[0-9]$/.test(seq[j])) { j++; count++ }
        i = count ? j : i + 2
      } else {
        if (!supported[code] && unknown.indexOf('\\' + code) < 0) unknown.push('\\' + code)
        i += 2
      }
    }
    return unknown.length ? 'Portpass will skip unsupported code' + (unknown.length > 1 ? 's' : '') + ': ' + unknown.join(', ') : ''
  }

  function sequenceLabel(seq) {
    return parseAutotypeTokens(seq).map(function(tok) {
      if (tok.type === 'nav') return tok.label
      if (tok.type === 'field') return fieldByCode(tok.code)?.label || tok.label
      return tok.label
    }).join(' → ')
  }

  function waitingSubText(seq) {
    var toks = parseAutotypeTokens(seq)
    if (!toks.length) return 'Click the field where the autofill will begin'
    var first = toks[0]
    if (first.type === 'field') {
      var names = { 'Username': 'the username', 'Password': 'the password',
                    'Email': 'the email address', 'One-time code': 'the one-time code' }
      var name = names[first.label] || first.label.toLowerCase()
      return 'Click the field to fill in ' + name
    }
    return 'Click the field where the autofill will begin'
  }

  function buildSequenceChips(seq) {
    var toks = parseAutotypeTokens(seq)
    if (!toks.length) return null
    var wrap = document.createElement('div')
    wrap.className = 'pp-chips-row'
    toks.forEach(function(tok, idx) {
      var chip = document.createElement('span')
      chip.className = 'pp-chip pp-chip-' + tok.type
      if (tok.type === 'error')   chip.textContent = '✕ ' + tok.label
      else if (tok.type === 'unknown') chip.textContent = '⚠ ' + tok.label
      else if (tok.suffix) {
        chip.appendChild(document.createTextNode(tok.label + ' '))
        var sfx = document.createElement('span')
        sfx.className = 'pp-chip-suffix'
        sfx.textContent = tok.suffix
        chip.appendChild(sfx)
      } else {
        chip.textContent = tok.label
      }
      wrap.appendChild(chip)
      if (idx < toks.length - 1) {
        var sep = document.createElement('span')
        sep.className = 'pp-chip-sep'
        sep.textContent = '→'
        wrap.appendChild(sep)
      }
    })
    return wrap
  }

  function canonicalURL(href) {
    var s = href || ''
    var pfxs = ['https://', 'http://']
    for (var i = 0; i < pfxs.length; i++) {
      if (s.toLowerCase().indexOf(pfxs[i]) === 0) { s = s.slice(pfxs[i].length); break }
    }
    var h = s.indexOf('#'); if (h >= 0) s = s.slice(0, h)
    var q = s.indexOf('?'); if (q >= 0) s = s.slice(0, q)
    s = s.toLowerCase()
    var sl = s.indexOf('/')
    if (sl >= 0) s = s.slice(0, sl).replace(/^www\./, '') + s.slice(sl)
    else s = s.replace(/^www\./, '')
    return s.replace(/\/+$/, '')
  }

})()
</script>
